name: Build DayFlow Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-dayflow-apks.yml"
      - "dayflow-android-application-development.zip"
      - "dayflow-android-application-development (1).zip"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: DayFlow ZIP 1
            artifact: dayflow-zip-1
            archive: dayflow-android-application-development.zip
          - label: DayFlow ZIP 2
            artifact: dayflow-zip-2
            archive: dayflow-android-application-development (1).zip

    steps:
      - name: Check out original repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT"
          "$SDKMANAGER" --version

      - name: Accept SDK licenses and install common Android platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Set up fallback Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract and inspect this ZIP
        id: inspect
        shell: bash
        run: |
          set -uo pipefail
          ARCHIVE="${{ matrix.archive }}"
          SRC="$RUNNER_TEMP/dayflow-source"
          OUT="$GITHUB_WORKSPACE/output/${{ matrix.label }}"
          mkdir -p "$SRC" "$OUT"
          if [ ! -f "$GITHUB_WORKSPACE/$ARCHIVE" ]; then
            echo "Archive not found: $ARCHIVE" | tee "$OUT/inspection.txt"
            echo "project_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$GITHUB_WORKSPACE/$ARCHIVE" "$OUT/source.zip"
          unzip -q "$GITHUB_WORKSPACE/$ARCHIVE" -d "$SRC"
          {
            echo "Archive: $ARCHIVE"
            echo
            echo "Top-level contents:"
            find "$SRC" -mindepth 1 -maxdepth 3 -printf '%y %p\n' | head -250
            echo
            echo "Android manifests:"
            find "$SRC" -type f -name AndroidManifest.xml -print
            echo
            echo "Gradle settings/build files:"
            find "$SRC" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' \) -print
            echo
            for f in "$SRC/package.json" "$SRC/capacitor.config.ts" "$SRC/android/gradle/wrapper/gradle-wrapper.properties" "$SRC/android/settings.gradle" "$SRC/android/build.gradle" "$SRC/android/app/build.gradle"; do
              if [ -f "$f" ]; then echo "===== $f ====="; sed -n '1,240p' "$f"; fi
            done
          } | tee "$OUT/inspection.txt"

          mapfile -t ROOTS < <(find "$SRC" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | sort -u)
          if [ "${#ROOTS[@]}" -eq 0 ]; then
            mapfile -t ROOTS < <(find "$SRC" -type f \( -name build.gradle -o -name build.gradle.kts \) -printf '%h\n' | sort -u)
          fi
          printf '%s\n' "${ROOTS[@]}" > "$OUT/project-roots.txt"
          if [ "${#ROOTS[@]}" -gt 0 ]; then
            echo "project_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "project_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all detected Android Gradle projects
        if: steps.inspect.outputs.project_found == 'true'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          OUT="$GITHUB_WORKSPACE/output/${{ matrix.label }}"
          BUILD_INDEX=0
          BUILD_FAILURES=0
          while IFS= read -r PROJECT_ROOT; do
            [ -n "$PROJECT_ROOT" ] || continue
            BUILD_INDEX=$((BUILD_INDEX + 1))
            LOG="$OUT/build-$BUILD_INDEX.log"
            echo "===== Project $BUILD_INDEX: $PROJECT_ROOT =====" | tee -a "$LOG"
            APP_ROOT="$(dirname "$PROJECT_ROOT")"
            DECOR_GALLERY="$APP_ROOT/src/features/decor/DecorGallery.tsx"
            if [ -f "$DECOR_GALLERY" ]; then
              python3 - "$DECOR_GALLERY" <<'PY'
from pathlib import Path
import sys
p = Path(sys.argv[1])
s = p.read_text(encoding="utf-8")
old = "import { Orn, Particles, HangingOrnaments } from './Decor';"
new = "import { Orn, Particles } from './Decor';"
if s.count(old) == 1:
    p.write_text(s.replace(old, new), encoding="utf-8")
    print("PATCH_APPLIED: removed unused HangingOrnaments import without UI changes")
elif new in s:
    print("PATCH_ALREADY_PRESENT: unused import is already removed")
else:
    raise SystemExit("PATCH_FAILED: expected exact import line was not found exactly once")
PY
              PATCH_RESULT=$?
              if [ "$PATCH_RESULT" -ne 0 ]; then BUILD_FAILURES=$((BUILD_FAILURES + 1)); fi
            fi
            if [ -f "$APP_ROOT/package.json" ]; then
            if [ -f "$APP_ROOT/package.json" ]; then
              echo "Preparing web assets and Capacitor Android project from $APP_ROOT" | tee -a "$LOG"
              cd "$APP_ROOT"
              npm ci 2>&1 | tee "$OUT/npm-install-$BUILD_INDEX.log"
              NPM_RESULT=${PIPESTATUS[0]}
              if [ "$NPM_RESULT" -ne 0 ]; then
                echo "NPM_INSTALL_RESULT=FAILED (exit $NPM_RESULT)" | tee -a "$LOG"
                BUILD_FAILURES=$((BUILD_FAILURES + 1))
              else
                if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
                  npm test 2>&1 | tee "$OUT/npm-test-$BUILD_INDEX.log"
                  TEST_RESULT=${PIPESTATUS[0]}
                  if [ "$TEST_RESULT" -ne 0 ]; then
                    echo "NPM_TEST_RESULT=FAILED (exit $TEST_RESULT)" | tee -a "$LOG"
                    BUILD_FAILURES=$((BUILD_FAILURES + 1))
                  else
                    echo "NPM_TEST_RESULT=SUCCESS" | tee -a "$LOG"
                  fi
                fi
                if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
                  npm run typecheck 2>&1 | tee "$OUT/typecheck-$BUILD_INDEX.log"
                  TYPECHECK_RESULT=${PIPESTATUS[0]}
                  if [ "$TYPECHECK_RESULT" -ne 0 ]; then
                    echo "TYPECHECK_RESULT=FAILED (exit $TYPECHECK_RESULT)" | tee -a "$LOG"
                    BUILD_FAILURES=$((BUILD_FAILURES + 1))
                  else
                    echo "TYPECHECK_RESULT=SUCCESS" | tee -a "$LOG"
                  fi
                fi
                if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
                  npm run build 2>&1 | tee "$OUT/web-build-$BUILD_INDEX.log"
                  WEB_RESULT=${PIPESTATUS[0]}
                  if [ "$WEB_RESULT" -ne 0 ]; then
                    echo "WEB_BUILD_RESULT=FAILED (exit $WEB_RESULT)" | tee -a "$LOG"
                    BUILD_FAILURES=$((BUILD_FAILURES + 1))
                  else
                    echo "WEB_BUILD_RESULT=SUCCESS" | tee -a "$LOG"
                  fi
                else
                  echo "No npm build script; keeping the existing web assets." | tee -a "$LOG"
                fi
                if compgen -G "$APP_ROOT/capacitor.config.*" > /dev/null; then
                  npx cap sync android 2>&1 | tee "$OUT/capacitor-sync-$BUILD_INDEX.log"
                  CAP_RESULT=${PIPESTATUS[0]}
                  if [ "$CAP_RESULT" -ne 0 ]; then
                    echo "CAPACITOR_SYNC_RESULT=FAILED (exit $CAP_RESULT)" | tee -a "$LOG"
                    BUILD_FAILURES=$((BUILD_FAILURES + 1))
                  fi
                fi
              fi
            fi
            cd "$PROJECT_ROOT"
            if [ -f ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
              chmod +x ./gradlew
              ./gradlew --no-daemon --stacktrace --warning-mode=all assembleDebug 2>&1 | tee -a "$LOG"
              RESULT=${PIPESTATUS[0]}
            else
              echo "Using installed Gradle 8.13 because the project wrapper JAR is missing." | tee -a "$LOG"
              gradle --no-daemon --stacktrace --warning-mode=all assembleDebug 2>&1 | tee -a "$LOG"
              RESULT=${PIPESTATUS[0]}
            fi
            if [ "$RESULT" -ne 0 ]; then
              BUILD_FAILURES=$((BUILD_FAILURES + 1))
              echo "BUILD_RESULT=FAILED (exit $RESULT)" | tee -a "$LOG"
            else
              echo "BUILD_RESULT=SUCCESS" | tee -a "$LOG"
            fi
            if [ "$RESULT" -eq 0 ]; then
              echo "Running Kotlin/Android unit tests." | tee -a "$LOG"
              if [ -f ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
                ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee "$OUT/android-tests-$BUILD_INDEX.log"
              else
                gradle --no-daemon testDebugUnitTest 2>&1 | tee "$OUT/android-tests-$BUILD_INDEX.log"
              fi
              ANDROID_TEST_RESULT=${PIPESTATUS[0]}
              if [ "$ANDROID_TEST_RESULT" -ne 0 ]; then
                echo "ANDROID_TEST_RESULT=FAILED (exit $ANDROID_TEST_RESULT)" | tee -a "$LOG"
                BUILD_FAILURES=$((BUILD_FAILURES + 1))
              else
                echo "ANDROID_TEST_RESULT=SUCCESS" | tee -a "$LOG"
              fi
            fi
            while IFS= read -r -d '' APK; do
              cp "$APK" "$OUT/project-$BUILD_INDEX-$(basename "$APK")"
            done < <(find . -type f -path '*/build/outputs/apk/*/*.apk' -print0)
          done < "$OUT/project-roots.txt"
          echo "Detected Gradle roots: $BUILD_INDEX" | tee "$OUT/build-summary.txt"
          echo "Failed builds: $BUILD_FAILURES" | tee -a "$OUT/build-summary.txt"
          find "$OUT" -type f -name '*.apk' -printf '%p (%s bytes)\n' | tee -a "$OUT/build-summary.txt"
          if [ "$BUILD_INDEX" -eq 0 ]; then
            echo "No Gradle build roots were found." | tee -a "$OUT/build-summary.txt"
          fi
          if [ "$BUILD_FAILURES" -gt 0 ]; then
            exit 1
          fi

      - name: Record absence of a Gradle project
        if: steps.inspect.outputs.project_found != 'true'
        run: echo "No Gradle project root found in ${{ matrix.archive }}." > "output/${{ matrix.label }}/build-summary.txt"

      - name: Upload APKs and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-apk-and-diagnostics
          path: output/${{ matrix.label }}/
          if-no-files-found: warn
          retention-days: 14
